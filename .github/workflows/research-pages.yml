name: Publish research milestone
on:
  push:
    branches: [main]
    paths:
      - 'docs/reviewer-milestone-20261022/**'
      - '.github/workflows/research-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docs/reviewer-milestone-20261022
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/reviewer-milestone-20261022
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
